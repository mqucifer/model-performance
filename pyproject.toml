[project]
name = "model-performance"
version = "0.1.0"
description = "Measures the crew's models from outside: the benchmark, the CAD-code evaluation, and the Spark's model swap."
readme = "README.md"
# The crew's version: the harness imports crew, which is pinned to 3.12.
requires-python = ">=3.12,<3.13"

dependencies = [
    # Pinned to a commit (mqucifer/project-print ADR 0004). Moving it is a deliberate change.
    "crew-org @ git+https://github.com/mqucifer/crew@099879fe31216b5c3b1b4fb7d8db0c00208d6496",
    "httpx>=0.27",
    # The role-fit replay checks each answer against its request's own JSON schema.
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
swap = "swap.cli:main"
replay = "benchmark.replay:main"
cad-eval = "cad_eval.run:main"
role-fit = "role_fit.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["swap", "common", "benchmark", "cad_eval", "role_fit"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The template's files are the template's (mqucifer/project-template).
extend-exclude = [".github"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["real_harness: reads this checkout's own commit and changes, not a clean stand-in"]
