# A test fixture, not a recorded launch: the shape a TensorFold record takes
# (mqucifer/infra#40), an engine that replaces SGLang on the same port.
name: tensorfold

services:
  tensorfold:
    image: tensorfold:test
    container_name: ${CONTAINER_NAME:-tensorfold}
    network_mode: host
    command: >-
      tensorfold serve
      --model ${MODEL_PATH:-nvidia/Nemotron-3.5-Bolt}
      --served-model-name ${SERVED_MODEL_NAME:-bolt}
      --port 8888
