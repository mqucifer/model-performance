# The swap's settings. No address, key or prompt lives here: the Spark is named
# by its key in infra's $INFRA_HOSTS, and the LiteLLM key by its name in the
# builders' env file. Both values stay on the Mac.

[spark]
# A key in $INFRA_HOSTS (default ~/.config/infra/hosts.env), kept by the Sponsor.
# The ssh user comes from ~/.ssh/config (NVIDIA Sync's), so there's no user key.
addr_key = "SPARK_ADDR"

[infra]
# A checkout of mqucifer/infra. The candidate starts from its recorded launch.
dir = "~/Documents/git/infra"

# The engines the Spark can serve with, each from its launch recorded in infra
# (mqucifer/infra#40). Each serves an OpenAI-compatible API on the 27B's port,
# so LiteLLM's SGLANG_BASE_URL never changes. `variables` are the ones its
# launch takes, so a candidate differs only in its model; `seed` says whether
# every request needs one. TensorFold isn't deterministic without one: since
# 1.1.4 an unseeded sampled request draws a fresh seed.
[engines.sglang]
compose = "compose/spark/sglang/compose.yaml"
variables = ["MODEL_PATH", "SERVED_MODEL_NAME", "SPECULATIVE_ARGS", "CONTAINER_NAME", "WEIGHTS_CACHE"]
seed = false

# The comparison arm on mqucifer/model-performance#4: an engine that replaces
# SGLang. Its launch is recorded in infra before the arm runs.
[engines.tensorfold]
compose = "compose/spark/tensorfold/compose.yaml"
variables = ["MODEL_PATH", "SERVED_MODEL_NAME", "CONTAINER_NAME", "WEIGHTS_CACHE"]
seed = true

# Flash-Next on the same TensorFold (mqucifer/model-performance#36). 1.1.6
# refuses the 27B's --drafter and --kv-cache fp8 for it, so it has its own
# launch, at 4 streams of 131,072. Its checks need no seed.
[engines.tensorfold-flashnext]
compose = "compose/spark/tensorfold/flashnext.yaml"
variables = ["MODEL_PATH", "SERVED_MODEL_NAME", "CONTAINER_NAME", "WEIGHTS_CACHE"]
seed = false

[serving]
# The 27B's engine. The restore always starts the 27B on it, whatever the candidate ran on.
baseline_engine = "sglang"
# The 27B's container, as `docker ps` names it on the Spark (inventory/services/sglang.yaml).
baseline_container = "qwen3.8-27b-sglang"
# The candidate's compose project and container, whatever its engine. It serves on the
# same port as the 27B, so LiteLLM's SGLANG_BASE_URL never changes.
candidate_project = "spark-candidate"
candidate_container = "spark-candidate"
# The served name LiteLLM's crew-candidate alias points at (mqucifer/infra#40).
candidate_served_name = "crew-candidate"
# The one weights cache every model server on the Spark mounts, under the
# Spark's home (the Sponsor's container rule, mqucifer/infra#40). Each engine's
# launch takes it as WEIGHTS_CACHE, so a candidate's weights land nowhere else.
weights_cache = "Qwen3.8-27B-SGLang-DGX-Spark/.cache/huggingface"
# How the 27B comes back: "start-dflash" (re-run its start script, as today),
# "container" (`docker start` the stopped container) or "compose" (the
# baseline engine's record with its defaults). The Sponsor chose "container",
# 2026-10-25 (mqucifer/infra#40): infra's read found the running 27B's image and
# memory flags come from start-dflash.sh's .env, so "start-dflash" brings back the
# same 27B only while that .env is unchanged; "container" doesn't depend on it.
restore = "container"
# Run on the Spark for restore = "start-dflash". Confirmed by step 1's read of
# the host (mqucifer/infra#40) before the first real run.
start_dflash = "cd ~/Qwen3.8-27B-SGLang-DGX-Spark && ./start-dflash.sh"

[litellm]
# Every check goes through the proxy. Anything but the Mac's :4000 is refused.
base_url = "http://localhost:4000"
baseline_alias = "crew-local"
candidate_alias = "crew-candidate"
key_file = "~/.config/crew/builders.env"
key_name = "CREW_LLM_API_KEY"
# SGLang loads a model in minutes; a 27B with its draft and 262k context is the slowest.
ready_timeout_s = 1200
poll_s = 20
